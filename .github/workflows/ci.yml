name: CI Frontend

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código (lints)
        run: flutter analyze

      # Épica 7: --coverage genera coverage/lcov.info. main.dart lleva
      # `// coverage:ignore-file` (bootstrap de Firebase/runApp, no
      # testeable) para no castigar el % global con código no cubrible.
      - name: Ejecutar tests con cobertura
        run: flutter test --coverage

      # Umbral mínimo de cobertura — falla el build si coverage/lcov.info
      # reporta menos de min_coverage%. Acción estándar de la comunidad
      # Flutter para esto (no hay equivalente nativo a jacoco:check).
      - name: Verificar cobertura mínima
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 65

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-lcov-frontend
          path: coverage/lcov.info